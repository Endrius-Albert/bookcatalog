apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookcatalog
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/Endrius-Albert/bookcatalog
    targetRevision: main
    path: k8s/devops-chart
    helm:
      valueFiles:
        - values.yaml
        - envs/prod/values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
