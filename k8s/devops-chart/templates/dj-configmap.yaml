apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-chart.fullname" . }}-dj-envs
  labels:
    {{- include "devops-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
data:
  {{- range .Values.environmentVariables }}
  {{ .name }}: "{{ .value }}"
  {{- end }}
